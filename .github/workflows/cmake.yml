name: DirectX 11 Build & Shader Validation

on: [push]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate DirectX 11 HLSL Shaders
        shell: pwsh
        run: |
          & ./tools/test.ps1 -All
